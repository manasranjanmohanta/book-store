# ENABLED PORT
server.port=8080

# ----------------------------
# ACTUATOR
# ----------------------------
management.endpoints.web.exposure.include=*


# ----------------------------
# DB CONFIGURATION
# ----------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sys?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}


# ----------------------------
# JPA & HIBERNATE CONFIGURATION
# ----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true


# ----------------------------
# FLYWAY CONFIGURATION
# ----------------------------
# Enables Flyway database migrations at application startup.
# Explicit for clarity, even though the Flyway starter enables it by default.
spring.flyway.enabled=true

# Location where Flyway looks for migration scripts.
# By convention: src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration

# TELL FLYWAY WHICH CUSTOM SCHEMA TO CREATE AND MANAGE
 # FIRST WAY:
    # 1. Forces the history table to be created inside book_store instead of sys
    #spring.flyway.default-schema=book_store
    # 2. Bypasses the "non-empty" check on the initial 'sys' connection
    #spring.flyway.baseline-on-migrate=true

# SECOND WAY
    spring.flyway.schemas=book_store
    spring.flyway.create-schemas=true
    spring.datasource.hikari.schema=book_store

